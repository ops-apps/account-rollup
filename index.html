document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"7e891351-022b-40e5-8afc-3f691c226bc0\"><\u002Fscript>\n\n<script>\n// Minimal in-browser .xlsx reader for the Account Rollup workbook.\n// No dependencies: unzips with DecompressionStream and parses the sheet XML.\n//\n// Expected sheets (extra sheets are ignored, missing sheets are skipped):\n//   Accounts        — Account | name | sentiment | arr | snapshot | wins | risks | ask | prds |\n//                     completed_last_period | cadence | last_touch | plan_30 | plan_60 | plan_90 | plan_year\n//   Driver Library  — Driver Name | Source | Theme\n//   Account Drivers — Account Key | Driver Name | KPIs (one per line)\n//   Driver Notes    — Account Key | Meta | Focus | Watch | Note | Expansion | Blocker | Removed | Removed Label\n//   Meta            — Field | Value\n\nfunction bullets(s) {\n  return String(s || '').split('\\n').map(x => x.replace(/^[•\\s]+/, '').trim()).filter(Boolean);\n}\n\nfunction sentences(t) {\n  return String(t || '').split(/(?<=[.!?])\\s+(?=[A-Z0-9\"'(])/).map(s => s.trim()).filter(Boolean);\n}\n\n// Plan cells are written as paragraphs; split them into readable bullets.\nfunction planBullets(s) {\n  const out = [];\n  for (const line of bullets(s)) for (const sen of sentences(line)) out.push(sen);\n  return out;\n}\n\nfunction parseMoney(v) {\n  if (v === undefined || v === null || String(v).trim() === '') return null;\n  // Take the first numeric token so cells like \"$211,000 / $239,000\" don't\n  // collapse into one giant concatenated number.\n  const s = String(v).replace(/,/g, '');\n  const m = s.match(/-?\\d+(\\.\\d+)?\\s*[kKmM]?/);\n  if (!m) return null;\n  let n = parseFloat(m[0]);\n  const suffix = m[0].slice(-1).toLowerCase();\n  if (suffix === 'k') n *= 1000;\n  if (suffix === 'm') n *= 1000000;\n  return isFinite(n) && n !== 0 ? n : null;\n}\n\n// Date cells arrive as serial numbers when typed as dates; text cells pass through.\nfunction excelDate(v) {\n  const s = String(v === undefined || v === null ? '' : v).trim();\n  if (!s) return '';\n  if (/^\\d+(\\.\\d+)?$/.test(s) && Number(s) > 20000 && Number(s) < 80000) {\n    const d = new Date(Date.UTC(1899, 11, 30) + Number(s) * 86400000);\n    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });\n  }\n  return s;\n}\n\nasync function unzip(file) {\n  const buf = new Uint8Array(await file.arrayBuffer());\n  const dv = new DataView(buf.buffer);\n  let eocd = -1;\n  for (let i = buf.length - 22; i >= 0; i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }\n  if (eocd < 0) throw new Error('Not a valid .xlsx file');\n  const count = dv.getUint16(eocd + 10, true);\n  let p = dv.getUint32(eocd + 16, true);\n  const entries = [];\n  for (let i = 0; i < count; i++) {\n    const method = dv.getUint16(p + 10, true);\n    const compSize = dv.getUint32(p + 20, true);\n    const nameLen = dv.getUint16(p + 28, true);\n    const extraLen = dv.getUint16(p + 30, true);\n    const commentLen = dv.getUint16(p + 32, true);\n    const localOffset = dv.getUint32(p + 42, true);\n    const name = new TextDecoder().decode(buf.slice(p + 46, p + 46 + nameLen));\n    entries.push({ name, method, compSize, localOffset });\n    p += 46 + nameLen + extraLen + commentLen;\n  }\n  const read = async (e) => {\n    const lp = e.localOffset;\n    const nl = dv.getUint16(lp + 26, true);\n    const el = dv.getUint16(lp + 28, true);\n    const start = lp + 30 + nl + el;\n    const raw = buf.slice(start, start + e.compSize);\n    if (e.method === 0) return new TextDecoder().decode(raw);\n    const out = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();\n    return new TextDecoder().decode(new Uint8Array(out));\n  };\n  return { entries, read };\n}\n\nfunction rowsFromSheet(doc, strings) {\n  return Array.from(doc.getElementsByTagName('row')).map(r => {\n    const cells = { __row: Number(r.getAttribute('r')) };\n    for (const c of Array.from(r.getElementsByTagName('c'))) {\n      const col = (c.getAttribute('r') || '').replace(/\\d+/g, '');\n      const t = c.getAttribute('t');\n      const node = c.getElementsByTagName('v')[0] || c.getElementsByTagName('t')[0];\n      const val = node ? node.textContent : '';\n      cells[col] = t === 's' ? (strings[+val] !== undefined ? strings[+val] : '') : val;\n    }\n    return cells;\n  }).filter(r => Object.keys(r).some(k => k !== '__row' && String(r[k]).trim() !== ''));\n}\n\n// Reads the whole workbook into { sheetsByName, sheetsInOrder, cellLinks }.\nasync function readWorkbook(file) {\n  const { entries, read } = await unzip(file);\n  const parser = new DOMParser();\n  const ssEntry = entries.find(e => e.name === 'xl/sharedStrings.xml');\n  const strings = ssEntry\n    ? Array.from(parser.parseFromString(await read(ssEntry), 'text/xml').getElementsByTagName('si')).map(si => si.textContent)\n    : [];\n\n  // sheet name → xl/worksheets/sheetN.xml, via workbook.xml + its rels\n  const order = [];\n  const wbEntry = entries.find(e => e.name === 'xl/workbook.xml');\n  const wbRels = entries.find(e => e.name === 'xl/_rels/workbook.xml.rels');\n  if (wbEntry && wbRels) {\n    const relDoc = parser.parseFromString(await read(wbRels), 'text/xml');\n    const relMap = {};\n    for (const rel of Array.from(relDoc.getElementsByTagName('Relationship'))) {\n      relMap[rel.getAttribute('Id')] = String(rel.getAttribute('Target') || '').replace(/^\\/?xl\\//, '');\n    }\n    const wbDoc = parser.parseFromString(await read(wbEntry), 'text/xml');\n    for (const sh of Array.from(wbDoc.getElementsByTagName('sheet'))) {\n      const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');\n      const target = relMap[rid];\n      if (target) order.push({ name: sh.getAttribute('name') || '', path: 'xl/' + target });\n    }\n  }\n  if (!order.length) {\n    entries.filter(e => /^xl\\/worksheets\\/sheet\\d+\\.xml$/.test(e.name))\n      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))\n      .forEach((e, i) => order.push({ name: 'Sheet' + (i + 1), path: e.name }));\n  }\n\n  const sheets = {};\n  const sheetList = [];\n  for (const s of order) {\n    const entry = entries.find(e => e.name === s.path);\n    if (!entry) continue;\n    const doc = parser.parseFromString(await read(entry), 'text/xml');\n    const rows = rowsFromSheet(doc, strings);\n    sheets[s.name.trim().toLowerCase()] = rows;\n    sheetList.push({ name: s.name, rows, doc, path: s.path });\n  }\n\n  // hyperlinks on the first sheet (so PRD ids keep their real Jira URLs)\n  const cellLinks = {};\n  const first = sheetList[0];\n  if (first) {\n    const relName = first.path.replace('xl/worksheets/', 'xl/worksheets/_rels/') + '.rels';\n    const relEntry = entries.find(e => e.name === relName);\n    const relMap = {};\n    if (relEntry) {\n      const relDoc = parser.parseFromString(await read(relEntry), 'text/xml');\n      for (const rel of Array.from(relDoc.getElementsByTagName('Relationship'))) relMap[rel.getAttribute('Id')] = rel.getAttribute('Target');\n    }\n    for (const h of Array.from(first.doc.getElementsByTagName('hyperlink'))) {\n      const rid = h.getAttribute('r:id') || h.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');\n      if (h.getAttribute('ref') && relMap[rid]) cellLinks[h.getAttribute('ref')] = relMap[rid];\n    }\n  }\n  return { sheets, sheetList, cellLinks };\n}\n\nconst norm = s => String(s || '').trim().toLowerCase();\n\nfunction accountsFromRows(rows, cellLinks) {\n  const hi = rows.findIndex(r => Object.keys(r).some(k => k !== '__row' && (norm(r[k]) === 'account' || norm(r[k]) === 'name')));\n  if (hi < 0) throw new Error('Could not find a header row with an \"Account\" column');\n  const header = rows[hi];\n  const colFor = pred => Object.keys(header).find(k => k !== '__row' && pred(norm(header[k])));\n  const cols = {\n    name: colFor(h => h === 'name') || colFor(h => h === 'account'),\n    sentiment: colFor(h => h.indexOf('sentiment') === 0),\n    snapshot: colFor(h => h.indexOf('snapshot') === 0),\n    wins: colFor(h => h.indexOf('win') === 0),\n    recentWins: colFor(h => h.indexOf('win') !== -1 && (h.indexOf('last month') !== -1 || h.indexOf('recent') !== -1 || h.indexOf('month') !== -1)),\n    risks: colFor(h => h.indexOf('risk') !== -1),\n    ask: colFor(h => h.indexOf('ask') === 0),\n    prds: colFor(h => h.indexOf('prd') !== -1),\n    arr: colFor(h => h.indexOf('arr') === 0 || h.indexOf('revenue') !== -1 || h.indexOf('contract value') !== -1),\n    completed: colFor(h => h.indexOf('completed') !== -1),\n    cadence: colFor(h => h.indexOf('cadence') === 0),\n    lastTouch: colFor(h => h.indexOf('last_touch') !== -1 || h.indexOf('last touch') !== -1),\n    d30: colFor(h => h.indexOf('30') !== -1),\n    d60: colFor(h => h.indexOf('60') !== -1),\n    d90: colFor(h => h.indexOf('90') !== -1),\n    year: colFor(h => h.indexOf('year') !== -1 || h.indexOf('12 month') !== -1)\n  };\n  if (!cols.sentiment) throw new Error('Could not find a \"Sentiment\" column');\n\n  const accounts = rows.slice(hi + 1).map(r => {\n    const prdCell = cols.prds ? cellLinks[cols.prds + r.__row] : '';\n    const ids = String(cols.prds ? r[cols.prds] || '' : '').split(/[,\\n]/).map(x => x.trim()).filter(Boolean);\n    const prds = ids.map((id, i) => {\n      let url;\n      if (i === 0 && prdCell) url = prdCell;\n      else if (prdCell && prdCell.indexOf('selectedIssue=') !== -1) url = prdCell.split('selectedIssue=')[0] + 'selectedIssue=' + id;\n      else url = 'https://cove.atlassian.net/browse/' + id;\n      return { id, url };\n    });\n    const plan = {\n      d30: planBullets(cols.d30 ? r[cols.d30] : ''),\n      d60: planBullets(cols.d60 ? r[cols.d60 c9ec;  /* near-identical to cv-blue */\n\n  /* Chrome — these paint the dashboard frame */\n  --cove-navbar: #1e272e;\n  --cove-sidebar: #203240;\n\n  /* ========== NAVY BLUE (primary buttons & surfaces) ========== */\n  --navy-blue-100: #40678f;\n  --navy-blue-300: #25415e;   /* primary:hover */\n  --navy-blue-500: #1c3147;   /* primary button bg */\n\n  /* ========== BLUE-GRAY (cool neutrals) ========== */\n  /* 100 keeps its cool tint; 200-900 are true grayscale, anchored 800 = #3A3A3A */\n  --blue-gray-100: #f1f3f7;\n  --blue-gray-200: #d7d7d7;\n  --blue-gray-300: #b8b8b8;\n  --blue-gray-400: #9a9a9a;\n  --blue-gray-500: #7b7b7b;\n  --blue-gray-600: #5c5c5c;\n  --blue-gray-700: #4b4b4b;\n  --blue-gray-800: #3a3a3a;\n  --blue-gray-900: #1f1f1f;\n\n  /* ========== GRAY (neutrals, Chakra-derived) ========== */\n  --gray-50:  #fbfbfb;\n  --gray-100: #f2f2f2;\n  --gray-200: #d7d7d7;\n  --gray-300: #c2c2c2;\n  --gray-400: #aeaeae;\n  --gray-500: #9a9a9a;\n  --gray-600: #7b7b7b;\n  --gray-700: #5c5c5c;\n  --gray-800: #3a3a3a;        /* default body text */\n  --gray-900: #1f1f1f;\n\n  /* ========== SEMANTIC STATES ========== */\n  --cv-success: #89be2c;\n  --cv-fail:    #dd5050;\n  --red-500:    #ff6658;      /* caution buttons */\n  --orange-500: #ed8936;\n  --yellow-500: #ecc94b;\n  --green-500:  #95C04A;\n  --teal-500:   #38b2ac;\n  --blue-500:   #4299e1;\n  --indigo-500: #667eea;\n  --purple-500: #9f7aea;\n  --pink-500:   #ed64a6;\n\n  /* Cove extended palette — used across categorical charts, chips,\n     calendar categories and role indicators. */\n  --cv-teal:       #2886a1;\n  --cv-turquoise:  #338AAB;   /* link color */\n  --cv-lightblue:  #3081ca;\n  --cv-bluegreen:  #37c5ab;\n  --cv-purple:     #7b6ff0;\n  --cv-magenta:    #a951a2;\n  --cv-green:      #478d6e;\n  --cv-brown:      #c48220;\n  --cv-orange:     #f28e4c;\n  --cv-yellow:     #f2c94c;\n  --cv-citrine:    #f7b500;\n  --cv-grey:       #5e6980;\n  --cv-checkbox-blue: #0095DA;\n\n  /* Calendar color tokens (used by the reservations calendar) */\n  --cv-cal-blue:   #33528D;\n  --cv-cal-green:  #0DA04B;\n  --cv-cal-orange: #EF6123;\n  --cv-cal-purple: #9B51E0;\n  --cv-cal-grey:   #687191;\n  --cv-cal-brown:  #AC5439;\n  --cv-cal-pink:   #D01261;\n\n  /* ========== SEMANTIC ROLES ========== */\n  /* These are the tokens *I* recommend using in new designs —\n     they map cleanly onto the raw palette above. */\n  --fg-1: var(--gray-800);    /* body text */\n  --fg-2: var(--gray-600);    /* muted text */\n  --fg-3: var(--gray-400);    /* disabled */\n  --fg-inverse: #ffffff;\n  --fg-link: var(--cv-turquoise);\n  --fg-link-hover: var(--cv-darkblue);\n\n  --bg-1: #ffffff;            /* page / card surface */\n  --bg-2: var(--gray-50);     /* page tint */\n  --bg-3: var(--gray-100);    /* subtle fills, hovers */\n  --bg-dark: var(--cove-sidebar);\n  --bg-darkest: var(--cove-navbar);\n\n  --border-1: var(--gray-200);/* default hairlines — matches cv-card */\n  --border-2: var(--gray-300);/* input outline via shadow */\n  --border-focus: var(--cove-highlight);\n\n  --accent:        var(--cv-blue);\n  --accent-strong: var(--navy-blue-500);\n  --success:       var(--cv-success);\n  --danger:        var(--cv-fail);\n  --warning:       var(--cv-citrine);\n  --info:          var(--cv-medium-blue);\n\n  /* ========== RADII ========== */\n  --radius-none: 0;\n  --radius-sm:   4px;\n  --radius:      8px;     /* default — buttons, inputs */\n  --radius-md:   10px;    /* cards */\n  --radius-lg:   12px;\n  --radius-xl:   16px;\n  --radius-2xl:  20px;\n  --radius-3xl:  24px;\n  --radius-full: 9999px;  /* chips, status dots, pills */\n\n  /* ========== SHADOWS ========== */\n  /* sm / md / lg straight from the dashboard boxShadow theme */\n  --shadow-sm: 0 0.250em 0.375em rgba(50,50,93,.09), 0 0.063em 0.188em rgba(0,0,0,.08);\n  --shadow-md: 0 0.063em 0.313em 0 rgba(0,0,0,.07), 0 0.438em 1.063em 0 rgba(0,0,0,.1);\n  --shadow-lg: 0 0.938em 2.188em rgba(50,50,93,.1), 0 0.313em 0.938em rgba(0,0,0,.07);\n  --shadow-input: 0 0 0 1px var(--gray-300);\n  --shadow-focus: 0 0 0 2px var(--cove-highlight);\n\n  /* ========== SPACING (4px scale) ========== */\n  --space-0: 0;\n  --space-1: 0.25rem;\n  --space-2: 0.5rem;\n  --space-3: 0.75rem;\n  --space-4: 1rem;\n  --space-5: 1.25rem;\n  --space-6: 1.5rem;\n  --space-8: 2rem;\n  --space-10: 2.5rem;\n  --space-12: 3rem;\n  --space-16: 4rem;\n  --space-20: 5rem;\n  --space-24: 6rem;\n\n  /* ========== LAYOUT ========== */\n  --sidebar-w: 16rem;        /* w-64 — dashboard side nav */\n  --sidebar-w-xl: 18rem;     /* xl:w-72 */\n\n  /* ========== MOTION ========== */\n  --ease-in:     cubic-bezier(0.4, 0, 1, 1);\n  --ease-out:    cubic-bezier(0, 0, 0.2, 1);\n  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);\n  --dur-fast:    150ms;\n  --dur-base:    200ms;\n  --dur-slow:    300ms;\n\n  /* ========== SIGNATURE GRADIENT ========== */\n  /* Used on AI / highlight buttons and the login background triangle */\n  --gradient-ai: linear-gradient(90deg, var(--cv-blue) 0%, var(--cv-darkblue) 100%);\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT DEFAULTS\n   Mirror the dashboard's @layer base + source.css rules.\n   ============================================================ */\n\nhtml, body {\n  font-family: var(--cove-font-sans);\n  font-size: var(--fs-base);\n  font-weight: var(--fw-normal); /* 500 — Tailwind's \"normal\" in this theme */\n  color: var(--fg-1);\n  line-height: var(--lh-tight);\n  background: var(--bg-1);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  margin: 0 0 0.5rem 0;\n  color: var(--fg-1);\n  line-height: var(--lh-tight);\n}\n\n/* Dashboard uses semibold for h1–h3 and thin (300) for h4–h5 */\nh1 { font-size: var(--fs-3xl); font-weight: var(--fw-semibold); }\n@media (min-width: 768px) { h1 { font-size: var(--fs-4xl); } }\n\nh2 { font-size: var(--fs-2xl); font-weight: var(--fw-semibold); }\n@media (min-width: 768px) { h2 { font-size: var(--fs-3xl); } }\n\nh3 { font-size: var(--fs-xl); font-weight: var(--fw-semibold); }\n@media (min-width: 768px) { h3 { font-size: var(--fs-2xl); } }\n\nh4 { font-size: var(--fs-lg); font-weight: var(--fw-thin); }\n@media (min-width: 768px) { h4 { font-size: var(--fs-xl); } }\n\nh5 { font-size: var(--fs-base); font-weight: var(--fw-thin); }\n@media (min-width: 768px) { h5 { font-size: var(--fs-lg); } }\n\np  { font-size: var(--fs-base); line-height: var(--lh-normal); }\nsmall, .text-sm { font-size: var(--fs-sm); }\n.text-xs { font-size: var(--fs-xs); }\n\na, .cv-link {\n  color: var(--fg-link);\n  font-weight: var(--fw-semibold);\n  text-decoration: none;\n}\na:hover, .cv-link:hover {\n  color: var(--fg-link-hover);\n  text-decoration: underline;\n}\n\ncode, kbd, samp, pre {\n  font-family: var(--cove-font-mono);\n  font-size: 0.95em;\n}\n\n/* Utility: the signature uppercase \"Powered by cove\" pill treatment */\n.cv-tag-pill {\n  display: inline-block;\n  padding: 0.5rem 1.5rem;\n  border-radius: var(--radius-full);\n  text-transform: uppercase;\n  font-size: var(--fs-xs);\n  font-weight: var(--fw-semibold);\n  letter-spacing: 0.025em;\n}\n<\u002Fstyle>\n  <script src=\"f0bac19d-ab91-4762-9788-06aeb82882e8\"><\u002Fscript>\n  <style>\n    html, body { margin: 0; padding: 0; height: 100%; background: #0e161d; }\n    a { color: #6fc7ec; }\n    a:hover { color: #a8def5; }\n    ::-webkit-scrollbar { width: 9px; height: 9px; }\n    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 5px; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: #0e161d; font-family: var(--cove-font-sans); color: #e9eff4;\" data-screen-label=\"Account Rollup — Command\">\n\n  <header style=\"position: sticky; top: 0; z-index: 20; background: rgba(14,22,29,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.09); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; min-width: 0;\">\n      <div style=\"font-size: 16px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #fff; white-space: nowrap;\">Account Rollup<\u002Fdiv>\n      <div style=\"font-size: 13px; color: #7f95a6; white-space: nowrap;\">David<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 18px; font-size: 13px; color: #7f95a6;\">\n      <sc-if value=\"{{ importError }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"color: #ff9d94; max-width: 280px;\">{{ importError }}<\u002Fspan>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ updatedLabel }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"white-space: nowrap;\">{{ updatedLabel }}<\u002Fspan>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ onToggleAll }}\" style=\"appearance: none; font-family: inherit; cursor: pointer; background: transparent; border: none; color: #7f95a6; font-size: 13px; font-weight: 600; padding: 6px 0; white-space: nowrap;\" style-hover=\"color: #fff;\">{{ toggleAllLabel }}<\u002Fbutton>\n      <sc-if value=\"{{ hasArchive }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ onToggleArchive }}\" style=\"appearance: none; font-family: inherit; cursor: pointer; background: transparent; border: none; color: #7f95a6; font-size: 13px; font-weight: 600; padding: 6px 0; white-space: nowrap;\" style-hover=\"color: #fff;\">{{ archiveLinkLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n      <a href=\"https://ops-apps.github.io/account-snapshot/\" target=\"_blank\" rel=\"noopener\" style=\"color: #7f95a6; text-decoration: none; font-weight: 600; white-space: nowrap;\" style-hover=\"color: #fff;\">Account Snapshot →<\u002Fa>\n      <button sc-camel-on-click=\"{{ onImportClick }}\" style=\"appearance: none; font-family: inherit; cursor: pointer; background: #52c9ec; border: none; color: #08131a; border-radius: 4px; padding: 7px 15px; font-size: 13px; font-weight: 700; white-space: nowrap;\" style-hover=\"background: #7ad8f5;\">Import workbook<\u002Fbutton>\n      <input type=\"file\" accept=\".xlsx\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onFileChange }}\" style=\"display: none;\">\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ showArchive }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 900px; margin: 0 auto; padding: 34px 40px 90px 40px; display: flex; flex-direction: column; gap: 26px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-size: 11.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: #7f95a6;\">Completed archive<\u002Fdiv>\n        <div style=\"font-size: 14.5px; color: #94a9b8; line-height: 1.55;\">Completed work moved out of the current period, by account.<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ archiveEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size: 14.5px; color: #7f95a6; line-height: 1.55; border-top: 1px solid rgba(255,255,255,0.09); padding-top: 18px;\">Nothing archived yet. Move older completed items to the Completed Archive sheet in the workbook and import it.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ archiveGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n        <div id=\"{{ g.anchorId }}\" style=\"display: flex; flex-direction: column; gap: 11px; border-top: 1px solid rgba(255,255,255,0.09); padding-top: 18px; scroll-margin-top: 84px;\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n            <div style=\"font-size: 15px; font-weight: 600; color: #fff;\">{{ g.short }}<\u002Fdiv>\n            <div style=\"font-size: 13px; color: #7f95a6;\">{{ g.count }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ g.items }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div sty ">Sentiment across the book<\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 20px;\">\n            <sc-for list=\"{{ sentimentBar }}\" as=\"seg\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; align-items: center; gap: 8px;\">\n                <span style=\"{{ seg.dotStyle }}\"><\u002Fspan>\n                <span style=\"font-size: 13.5px; font-weight: 600; color: #fff;\">{{ seg.count }}<\u002Fspan>\n                <span style=\"font-size: 13.5px; color: #94a9b8;\">{{ seg.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 3px; height: 10px;\">\n          <sc-for list=\"{{ sentimentBar }}\" as=\"seg\" hint-placeholder-count=\"3\">\n            <div style=\"{{ seg.barStyle }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-size: 11.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: #7f95a6;\">Jump to account<\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 9px;\">\n          <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"9\">\n            <button sc-camel-on-click=\"{{ item.onClick }}\" style=\"{{ item.chipStyle }}\" style-hover=\"background: rgba(255,255,255,0.07);\">\n              <span style=\"{{ item.dotStyle }}\"><\u002Fspan>\n              <span>{{ item.short }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start;\">\n        <div style=\"border: 1px solid rgba(255,255,255,0.09); border-radius: 8px; background: #141f28; overflow: hidden;\">\n          <div style=\"padding: 15px 22px; border-bottom: 1px solid rgba(255,255,255,0.09); display: flex; ali       <sc-for list=\"{{ h.items }}\" as=\"item\" hint-placeholder-count=\"2\">\n                          <div style=\"{{ item.cardStyle }}\">\n                            <sc-for list=\"{{ item.sentences }}\" as=\"s\" hint-placeholder-count=\"2\">\n                              <div style=\"display: flex; gap: 8px; align-items: flex-start;\">\n                                <span style=\"{{ s.dotStyle }}\"><\u002Fspan>\n                                <span style=\"font-size: 13.5px; line-height: 1.5; color: #cfdce5;\">{{ s.text }}<\u002Fspan>\n                              <\u002Fdiv>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                        <sc-if value=\"{{ h.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"font-size: 13px; color: #6b8092; font-style: italic;\">Nothing planned yet.<\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 20px;\">\n                <div style=\"display: flex; flex-direction: column; gap: 11px;\">\n                  <div style=\"font-size: 11.5px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: #89be2c;\">Wins<\u002Fdiv>\n                  <sc-for list=\"{{ acct.wins }}\" as=\"w\" hint-placeholder-count=\"3\">\n                    <div style=\"display: flex; gap: 10px; align-items: flex-start;\">\n                      <span style=\"display: inline-block; width: 5px; height: 5px; border-radius: 9999px; background: #89be2c; margin-top: 6px; flex-shrink: 0;\"><\u002Fspan>\n                      <span style=\"font-size: 13.5px; line-height: 1.55; color: #cfdce5;\">{{ w.text }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 11px;\">\n                  <div style=\"font-size: 11.5px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: #f7b500;\">Risks / flags<\u002Fdiv>\n                  <sc-for list=\"{{ acct.risks }}\" as=\"r\" hint-placeholder-count=\"2\">\n                    <div style=\"display: flex; gap: 10px; align-items: flex-start;\">\n                      <span style=\"display: inline-block; width: 5px; height: 5px; border-radius: 9999px; background: #f7b500; margin-top: 6px; flex-shrink: 0;\"><\u002Fspan>\n                      <span style=\"font-size: 13.5px; line-height: 1.55; color: #cfdce5;\">{{ r.text }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n\n              <sc-if value=\"{{ acct.hasKpi }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-top: 1px solid rgba(255,255,255,0.07); padding-top: 22px; display: flex; flex-direction: column; gap: 4px;\">\n                  <div style=\"display: grid; grid-template-columns: minmax(260px,1fr) 1.35fr; gap: 26px; align-items: baseline;\">\n                    <div style=\"font-size: 12.5px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: #52c9ec;\">{{ acct.kpiTitle }}<\u002Fdiv>\n                    <div style=\"font-size: 12.5px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: #52c9ec;\">KPIs · How we measure success<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ acct.drivers }}\" as=\"dr\" hint-placeholder-count=\"4\">\n                    <div style=\"{{ dr.rowStyle }}\">\n                      <div style=\"display: flex; gap: 10px; align-items: flex-start;\">\n                        <span style=\"{{ dr.rankStyle }}\">{{ dr.rank }}<\u002Fspan>\n                        <span style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0;\">\n                          <span style=\"font-size: 16px; font-weight: 600; color: #fff; line-height: 1.35; text-wrap: pretty;\">{{ dr.name }}<\u002Fspan>\n                          <span style=\"display: flex; align-items: center; gap: 11px; flex-wrap: wrap;\">\n                            <span style=\"{{ dr.sourceStyle }}\">{{ dr.source }}<\u002Fspan>\n                            <span style=\"{{ dr.themeStyle }}\">{{ dr.theme }}<\u002Fspan>\n                          <\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display: flex; flex-direction: column; gap: 7px; padding-top: 1px;\">\n                        <sc-if value=\"{{ dr.hasLede }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"font-size: 14.5px; line-height: 1.55; color: #94a9b8;\">{{ dr.lede }}<\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-for list=\"{{ dr.kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n                          <div style=\"display: flex; gap: 9px; align-items: flex-start;\">\n                            <span style=\"{{ k.dotStyle }}\"><\u002Fspan>\n                            <span style=\"font-size: 14.5px; line-height: 1.55; color: #cfdce5; text-wrap: pretty;\">{{ k.text }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ acct.hasEvidence }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"border-top: 1px solid rgba(255,255,255,0.07); margin-top: 8px; padding-top: 18px; display: flex; flex-direction: column; gap: 12px;\">\n                      <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n                        <span style=\"font-size: 12.5px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: #e8834a;\">{{ acct.evTitle }}<\u002Fspan>\n                        <span style=\"font-size: 13.5px; color: #7f95a6;\">{{ acct.evSub }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <sc-for list=\"{{ acct.evRows }}\" as=\"ev\" hint-placeholder-count=\"4\">\n                        <div style=\"display: grid; grid-template-columns: 210px 1.5fr 1fr; gap: 22px; align-items: start; padding: 11px 0; border-top: 1px solid rgba(255,255,255,0.06);\">\n                          <span style=\"font-size: 14.5px; font-weight: 600; color: #fff; line-height: 1.45;\">{{ ev.signal }}<\u002Fspan>\n                          <span style=\"font-size: 14px; line-height: 1.55; color: #cfdce5;\">{{ ev.finding }}<\u002Fspan>\n                          <span style=\"font-size: 14px; line-height: 1.55; color: #94a9b8;\">{{ ev.points }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 34px; border-top: 1px solid rgba(255,255,255,0.07); margin-top: 8px; padding-top: 18px;\">\n                    <sc-for list=\"{{ acct.kpiNotes }}\" as=\"n\" hint-placeholder-count=\"3\">\n                      <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n                        <span style=\"{{ n.labelStyle }}\">{{ n.label }}<\u002Fspan>\n                        <span style=\"font-size: 14.5px; line-height: 1.6; color: #cfdce5; text-wrap: pretty;\">{{ n.text }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch;\">\n                <sc-if value=\"{{ acct.hasPrds }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"flex: 1; min-width: 240px; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 15px 18px; display: flex; flex-direction: column; gap: 11px;\">\n                    <div style=\"font-size: 11.5px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: #b98bd6;\">High priority PRDs<\u002Fdiv>\n                    <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n                      <sc-for list=\"{{ acct.prds }}\" as=\"prd\" hint-placeholder-count=\"2\">\n                        <a href=\"{{ prd.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 12.5px; font-weight: 700; color: #e9eff4; text-decoration: none; border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; padding: 5px 11px;\" style-hover=\"border-color: #b98bd6; color: #d9b8ec;\">{{ prd.id }}<\u002Fa>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"display: flex; justify-content: flex-end;\">\n                <button sc-camel-on-click=\"{{ acct.onToggle }}\" title=\"Collapse\" style=\"appearance: none; font-family: inherit; cursor: pointer; background: transparent; border: 1px solid rgba(255,255,255,0.14); border-radius: 4px; color: #7f95a6; padding: 5px 11px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;\" style-hover=\"color: #fff; border-color: rgba(255,255,255,0.32);\">\n                  <span>Collapse<\u002Fspan>\n                  <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 14 14\" style=\"display: block; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;\">\n                    <polyline points=\"3,7.5 7,3.5 11,7.5\"><\u002Fpolyline>\n                    <polyline points=\"3,11 7,7 11,11\"><\u002Fpolyline>\n                  <\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;askOwner&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Nick&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot; },\n  &quot;periodLabel&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Bi-Weekly Review&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot; },\n  &quot;riskLimit&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 6, &quot;min&quot;: 3, &quot;max&quot;: 20, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Content&quot; },\n  &quot;winLimit&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 6, &quot;min&quot;: 3, &quot;max&quot;: 20, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Content&quot; }\n}\">\nclass Component extends DCLogic {\n  static KPI_MODULE = (function () {\n// Account Value Driver Framework — generated from Account_Rollup_Template.xlsx.\n// Each account is defined by its Value Drivers (in weight order, highest first).\n// KPIs sit underneath each driver as the evidence that driver is being met.\n// Keys match account names by lowercase substring.\n\nconst SOURCE_COLORS = {\n  Native: '#89be2c',\n  Mixed: '#52c9ec',\n  Manual: '#f7b500',\n  Roadmap: '#c86dd7',\n  Jira: '#b98bd6',\n  Readiness: '#7f95a6'\n};\n\nconst SOURCE_LEGEND = [\n  { tag: 'Native', meaning: 'Available in Insights cards or in product. No manual work per cycle.' },\n  { tag: 'Mixed', meaning: 'Partly native, partly a custom report pull.' },\n  { tag: 'Manual', meaning: 'Custom report, export, or tracking held outside the product.' },\n  { tag: 'Roadmap', meaning: 'Depends on capability not yet shipped. Measure the gap and the PRD, not the outcome.' },\n  { tag: 'Jira', meaning: 'PRD and product request tracking.' },\n];\n\nconst CORE_METRICS = [\n  { n: '1', name: 'Active users as % of directory', def: 'Users active in last 30 days ÷ total directory users', source: 'Native', why: 'The earliest churn signal available.' },\n  { n: '2', name: 'Module breadth', def: 'Count of Insights card types showing activity, out of 9', source: 'Native', why: 'Measures how replaceable Cove is, since a shallow account is an easy account to cancel.' },\n  { n: '3', name: 'Product request fulfilment', def: 'Open PRDs, age of oldest, delivered in period', source: 'Jira', why: 'The only core metric where the fix sits entirely inside Cove.' },\n];\n\nconst CORE_READING = [\n  'High breadth with falling active users is an adoption problem.',\n  'Low breadth with healthy users is an expansion opportunity.',\n  'Either one alongside high open PRD age is a renewal conversation.',\n];\n\nconst THEMES = {\n  'Labour efficiency': '#52c9ec',\n  'Revenue integrity': '#89be2c',\n  'Risk and compliance': '#f7b500',\n  'Portfolio visibility': '#4f8ff7',\n  'Tenant experience': '#c86dd7',\n  'Partnership': '#e8834a'\n};\n\nconst LIBRARY = [\n  { name: 'WO, PM and Inspection metrics and trend tracking', source: 'Mixed', theme: 'Labour efficiency' },\n  { name: 'Recurring issue identification and alerts via insights', source: 'Roadmap', theme: 'Labour efficiency' },\n  { name: 'Portfolio-wide data standardization', source: 'Native', theme: 'Portfolio visibility' },\n  { name: 'Per-site tenant and building staff activity consistency', source: 'Native', theme: 'Portfolio visibility' },\n  { name: 'Work order billing consistency', source: 'Native', theme: 'Revenue integrity' },\n  { name: 'Monthly custom billing report consistency (Willis)', source: 'Manual', theme: 'Revenue integrity' },\n  { name: 'COI transcription accuracy and tracking', source: 'Native', theme: 'Risk and compliance' },\n  { name: 'Seamless tenant and visitor access experience', source: 'Native', theme: 'Tenant experience' },\n  { name: 'Tenant visitor management adoption across portfolio', source: 'Native', theme: 'Tenant experience' },\n  { name: 'Visitor management watchlist readiness, flexibility and hygiene', source: 'Native', theme: 'Risk and compliance' },\n  { name: 'Engagement driving through consistent content, plus ease of access to emergency notifications', source: 'Native', theme: 'Tenant experience' },\n  { name: 'Maximize awareness of onsite amenities to grow tenant revenue', source: 'Native', theme: 'Revenue integrity' },\n  { name: 'Tenant form and waiver tracking', source: 'Native', theme: 'Risk and compliance' },\n  { name: 'Time card adoption portfolio-wide', source: 'Native', theme: 'Labour efficiency' },\n  { name: 'Detailed vendor inspection reports', source: 'Native', theme: 'Risk and compliance' },\n  { name: 'Detailed and thoughtful invoice generation', source: 'Roadmap', theme: 'Revenue integrity' },\n  { name: 'Vendor-friendly access to WO, PM and inspection modules', source: 'Native', theme: 'Labour efficiency' },\n  { name: 'Partnership in frequent data cleanup and maintenance', source: 'Manual', theme: 'Portfolio visibility' },\n  { name: 'Product request triage responsiveness', source: 'Jira', theme: 'Partnership' },\n  { name: 'Labour and material cost capture accuracy', source: 'Mixed', theme: 'Revenue integrity' },\n  { name: 'Post-cutover data hygiene and maintenance', source: 'Manual', theme: 'Portfolio visibility' },\n  { name: 'Post-launch tenant admin and building staff training', source: 'Manual', theme: 'Tenant experience' },\n  { name: 'User-friendly engagement modules, with scheduling for building teams', source: 'Native', theme: 'Tenant experience' },\n  { name: 'Persistent tenant engagement and activity via content', source: 'Native', theme: 'Tenant experience' },\n  { name: 'Innovation partnership and roadmap co-development', source: 'Manual', theme: 'Partnership' },\n  { name: 'Partnership in consolidating the portfolio tech stack', source: 'Manual', theme: 'Partnership' },\n  { name: 'Mitigate engagement and resource booking tech stack', source: 'Native', theme: 'Partnership' },\n  { name: 'Recurring issue identification, predictive analytics and alerts via insights', source: 'Roadmap', theme: 'Portfolio visibility' }\n];\n\nconst LIBRARY_NOTE = 'Source tags: Native = available in Insights/product natively. Mixed = partly native, partly a custom pull. Manual = tracked outside the product. Roadmap = depends on an unshipped capability. Jira = PRD/product-request tracking.';\n\nfunction d(name, kpis) {\n  const lib = LIBRARY.find(l => l.name === name) || { source: 'Native', theme: 'Portfolio visibility' };\n  return { name, source: lib.source, theme: lib.theme, kpis };\n}\n\nconst ACCOUNT_DRIVERS = {\n  beacon: {\n    meta: '~14 sites',\n    drivers: [\n      d('Portfolio-wide data standardization', 'Work Order issues & categories standardized per site · Work Group naming standardized per site · Work Orders, PMs, and Inspections routed to correct teams · PM and inspection template standardization'),\n      d('WO, PM and Inspection metrics and trend tracking', 'Completion time trend (Ray’s named focus area) · PM on-time % (Banasha King & other Directors) · Inspection completion per site (Asset Managers) · % of tickets closed within due date'),\n      d('Recurring issue identification and alerts via insights', 'Top recurring issue types per site (Jerome - Beacon NYC Asset Mgr) · Repeat WOs inside 90 days · Surface trends early to enable owners and building teams to be proactive'),\n      d('Per-site tenant and building staff activity consistency', 'Active % of directory per site · Low activity site re-engagement · Building staff and tenant activity per site'),\n      d('Innovation partnership and roadmap co-development', 'Roadmap previews delivered per quarter · Betas enrolled · Beacon originated ideas that became a PRD · Forward-looking roadmap share'),\n      d('Engagement driving through consistent content, plus ease of access to emergency notifications', 'Announcements per site per month · % sites posting twice monthly · Emergency notification send to delivery time · % directory reachable'),\n      d('Seamless tenant and visitor access experience', 'Visitor volume trend per tenant · Wallet or ACS activation rate · Pre-registration vs walk-up (security desk vs tenant registration) · % visits auto provisioned'),\n      d('Partnership in consolidating the portfolio tech stack', 'Legacy systems retired per site · Modules replacing a named incumbent'),\n      d('Work order billing consistency', 'Measured site by site, since every site runs its own cycle: Cycle date configured to match what each site’s accounting team actually closes on · Cycles uploading clean with zero manual correction · Verified Date coverage before each site’s billing close')\n    ],\n    watch: 'Dark sites. 1375 W Fulton has no rollout owner and 1740 Broadway is a vacant white box.',\n    note: 'The billing driver is phrased site by site because of BofA Tower. Cove was configured on a 20th to 20th cycle while Tiffany’s accounting close runs the 15th. Clean data on the wrong dates still fails, so cycle alignment per site is the first KPI, not an afterthought.'\n  },\n  perform: {\n    meta: 'Park Ave, Seattle, Willis Tower, Miami, Playa District',\n    drivers: [\n      d('Work order billing consistency', 'Cycle date configured to match what each site’s accounting team actually closes on · Cycles uploading clean with zero manual correction · Verified Date coverage before each site’s billing close'),\n      d('Monthly custom billing report consistency (Willis)', 'On-time against the 8th, 9th and 15th dates · Post-delivery corrections · Requested labor analytics fields present'),\n      d('Per-site tenant and building staff activity consistency', 'Active % of directory per site · Low activity site re-engagement · Building staff and tenant activity per site'),\n      d('Partnership in frequent data cleanup and maintenance', 'Duplicate and inactive users removed per cycle · Directory accuracy · PM task and equipment audit · Cleanup session once per quarter'),\n      d('COI transcription accuracy and tracking', 'Transcription accuracy on sample · % tenants and vendors current · Expired but active COIs · reminders firing at 30 and 15 days'),\n      d('Engagement driving through consistent content, plus ease of access to emergency notifications', 'Announcements per site per month · % sites posting twice monthly · Emergency notification send to delivery time · % directory reachable'),\n      d('Product request triage responsiveness', 'Open items in triage vs roadmapped · Items closed as a training gap rather than a build')\n    ],\n    removed: 'Mobile access trends and usage · active users per site trend (now inside per-site activity consistency) · reservations volume.',\n    focus: 'Billing consistency and the Willis report. Both are recurring, dated commitments where a miss is visible to the client immediately.',\n    watch: 'The triage backlog. 33 of 48 open items sit in New to Review, Needs Discussion or TBD LOE, only 2 are In Development, and 11 date to 2022 or 2023. It is the most likely source of a renewal complaint and it is entirely inside Cove’s control.',\n    note: 'Miami and Playa District have logged 3 requests each against Park Ave’s 37. Read that as silence, not satisfaction, and confirm it against per-site activity before the next review.'\n  },\n  amtrust: {\n    meta: 'Watch, improving',\n    drivers: [\n      d('Seamless tenant and visitor access experience', 'Mobile credential issued as % of directory · Pass activation rate · Pre-registration vs walk-up · Check-in to badge time'),\n      d('Work order billing consistency', 'Cycles uploading clean · schema rejections · Verified Date coverage before close · billable total vs posted amount'),\n      d('Tenant visitor management adoption across portfolio', '% tenant hosts registering a visitor in 30 days · Tenant registered vs staff registered visitors'),\n      d('Maximize awareness of onsite amenities to grow tenant revenue', 'Reservations per site and per space · Reservation count per tenant · Reservations billed monthly · Reservation hours booked monthly')\n    ],\n    removed: 'Active users as % of directory (still tracked as a core metric) · work order volume · mobile access trends · visitor check-in volume (now inside the access and adoption drivers).',\n    focus: 'Access experience and VM adoption. Together they are the proof the Angus replacement worked, ahead of the 30 September expiry.',\n    watch: 'Three go-lives land inside this cycle (Chicago 10 Aug, 250 Broadway 21 Aug, 59 Maiden 1 Sept). Baseline each site immediately after go-live so the ramp is visible.'\n  },\n  quadreal: {\n    meta: 'Six migration groups',\n    drivers: [\n      d('Post-cutover data hygiene and maintenance', 'Duplicate and legacy task trend per group · PM task volume normalised · Legacy records past 60 days (part of cutover records) · Accurate routing audit post-launch'),\n      d('WO, PM and Inspection metrics and trend tracking', 'WO volume trend per group · Submission to completion time · % work orders closed within target · PM on-time % · Inspection completion'),\n      d('Vendor-friendly access to WO, PM and inspection modules', 'Active vendor users as % of accounts created · vendor completed WOs as % assigned · vendor mobile adoption for PM and inspections · vendor items overdue · vendor access tickets'),\n      d('Per-site tenant and building staff activity consistency', 'Activity consistency across the six groups · Ops activity per site')\n    ],\n    removed: 'Quick work order completion time, now covered by WO, PM and Inspection metrics and trend tracking.',\n    removedLabel: 'Replaced this round',\n    focus: 'Per-group activity. All six groups went live by 31 July and later groups are where migration value usually leaks.',\n    watch: 'The gauge module inflated PM task volume roughly tenfold. Do not read that as engagement. Normalisation only becomes meaningful once the native fix ships.',\n    note: 'Vendor navigation is Work Orders only on the dashboard. PM and inspections for vendors exist on mobile only, so vendor adoption has to be measured on mobile.'\n  },\n  rockhill: {\n    drivers: [\n      d('Recurring issue identification and alerts via insights', 'Top recurring issue types per site · repeat WOs inside 90 days · time from first occurrence to corrective PM · Rockhill requests blocked by the gap'),\n      d('Work order billing consistency', 'MRI upload cycles with zero manual correction · Verified Date coverage before close'),\n      d('Portfolio-wide data standardization', 'Due-date coverage % · Issue types and categories per site vs approved list · Field completeness on WOs · PM and inspection template reuse · PM work group routing'),\n      d('WO, PM and Inspection metrics and trend tracking', 'PM on-time completion % · WO completion rate · Average time to completion · % closed within target · Inspection completion'),\n      d('Seamless tenant and visitor access experience', 'Credential issued as % of directory · Credential scan success · Pre-registration vs walk-up'),\n      d('Visitor management watchlist readiness, flexibility and hygiene', 'Sites with a watchlist configured · Matches flagged and resolved')\n    ],\n    removed: 'All previous drivers replaced. Due-date coverage and visitor readiness survive as KPIs under the new drivers.',\n    focus: 'Due-date coverage. Only 162 of 7,442 work orders carried a due date, which is why on-time reads 20.4% against an 85% target. The headline metric cannot move until coverage does.',\n    watch: 'UNGA at One Dag in September on a newly integrated VM setup. The highest stakes measurable event in the book this quarter.',\n    note: '75-101 Federal and 99 Summer are staying. Their PM procedures are being revised to be easier to complete, so baseline both sites before the revision lands. PM on-time completion there is the cleanest before and after measurement in the book this quarter.'\n  },\n  boyle: {\n    meta: '91 sites',\n    drivers: [\n      d('COI transcription accuracy and tracking', 'Transcription accuracy on sample · % tenants and vendors current · Expired but active COIs · reminders firing at 30 and 15 days'),\n      d('Recurring issue identification and alerts via insights', 'Top recurring issue types per site (Jerome - Beacon NYC Asset Mgr) · Repeat WOs inside 90 days · Surface trends early to enable owners and building teams to be proactive'),\n      d('WO, PM and Inspection metrics and trend tracking', 'WO volume trend across 91 sites · Submission to completion time per site · % closed within target · PM on-time % · Inspection completion'),\n      d('Time card adoption portfolio-wide', '% engineers submitting weekly · sites with zero use · Mobile vs dashboard submission · Network-level time card PRD status'),\n      d('Detailed vendor inspection reports', '% vendor inspections with required photos · Questions answered vs skipped · Vendor vs staff completion rate · Corrective WOs from failed questions · Reports exported per cycle'),\n      d('Detailed and thoughtful invoice generation', 'Open invoicing PRDs and age of oldest · line-item detail gap list vs requirement · manual edits per invoice today · retail sales reporting PRD status')\n    ],\n    focus: 'Time card adoption. Network-level time cards is one of their two blocking PRDs, so usage tells you what that PRD is actually worth to them.',\n    watch: '91 sites means the highest dark-site risk in the book, and it is the evidence base for the 100+ retail expansion.',\n    note: 'Product request fulfilment matters more here than anywhere. Two PRDs with no ETA, VP-l
